name: Publish study dashboard
on:
  push:
    branches: [master]
  workflow_dispatch:
permissions:
  contents: write
  actions: read
  pages: write
  id-token: write
concurrency:
  group: study-pages
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: master
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build dashboard data
        run: python _study/scripts/build.py
      - name: Validate generated dashboard
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path('study/data.json').read_text())
          assert data['topics'], 'No topics generated'
          expected = sum(t['score'] + sum(r['score'] for r in t.get('reviews', [])) for t in data['topics'])
          assert data['history'] and data['history'][-1]['total'] == expected, 'History total mismatch'
          print(f'Validated {len(data["topics"])} topics; total {expected}')
          PY
      - name: Keep generated dashboard in master
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add study/
          if ! git diff --cached --quiet; then
            git commit -m 'build: refresh study dashboard data'
            git push origin HEAD:master
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site
      - name: Preserve standalone dashboard files
        run: sudo cp -r study/. _site/study/
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - uses: actions/deploy-pages@v4
        id: deployment
