<svg xmlns="http://www.w3.org/2000/svg" width="600" height="490" viewBox="0 0 600 490" role="img" aria-labelledby="title desc">
<title id="title">BCP의 업무 범위와 그 안의 IT 복구</title><desc id="desc">BCP는 사람·장소·업무·협력사·IT의 지속 방안을 포함하며, DRP는 이 가운데 IT 복구 계획이다. BIA의 우선순위·목표가 두 계획에 연결된다.</desc>
<rect width="600" height="490" fill="white"/>
<g font-family="-apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Noto Sans KR', 'Malgun Gothic', sans-serif"><rect x="145" y="20" width="310" height="65" rx="5" fill="#eef3fc" stroke="#2858b6" stroke-width="2.5"/><text x="300.0" y="60.55" font-size="23" fill="#17263c" font-weight="600" text-anchor="middle">BIA · 우선순위·복구 목표</text><path d="M300 85 L300 130" fill="none" stroke="#2858b6" stroke-width="2.5" stroke-linejoin="round"/><path d="M305.00 120.00 L300 130 L295.00 120.00" fill="none" stroke="#2858b6" stroke-width="2.5"/><rect x="30" y="130" width="540" height="325" rx="5" fill="#eef3fc" stroke="#2858b6" stroke-width="2.5"/><text x="300" y="173" font-size="26" fill="#17263c" font-weight="650" text-anchor="middle">BCP · 업무연속성 계획</text><text x="300" y="223" font-size="23" fill="#17263c" font-weight="500" text-anchor="middle">사람 · 장소 · 협력사 · 연락 · 업무</text><rect x="75" y="275" width="450" height="80" rx="5" fill="#eef3fc" stroke="#2858b6" stroke-width="2.5"/><text x="300.0" y="323.05" font-size="23" fill="#17263c" font-weight="600" text-anchor="middle">DRP · IT 시스템·데이터 복구 계획</text><text x="300" y="416" font-size="23" fill="#17654a" font-weight="500" text-anchor="middle">DRS · 복구 자원과 기술 체계</text></g></svg>
