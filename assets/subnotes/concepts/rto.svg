<svg xmlns="http://www.w3.org/2000/svg" width="600" height="380" viewBox="0 0 600 380" role="img" aria-labelledby="title desc">
<title id="title">RTO를 구분하는 공통 시간축</title><desc id="desc">장애 전 복구 가능한 데이터 시점부터 장애까지는 데이터 손실 구간, 장애부터 서비스 복구까지는 복구 소요시간이다. RPO와 RTO는 각각 이 구간에 대한 목표다.</desc>
<rect width="600" height="380" fill="white"/>
<g font-family="-apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Noto Sans KR', 'Malgun Gothic', sans-serif"><text x="300" y="35" font-size="25" fill="#17263c" font-weight="700" text-anchor="middle">장애 전 데이터 · 장애 후 복구</text><path d="M40 175 L565 175" fill="none" stroke="#2858b6" stroke-width="2.5" stroke-linejoin="round"/><path d="M555.00 170.00 L565 175 L555.00 180.00" fill="none" stroke="#2858b6" stroke-width="2.5"/><path d="M95 145 L95 195" stroke="#2858b6" stroke-width="2.5" fill="none"/><text x="95" y="88" font-size="22" fill="#17263c" font-weight="500" text-anchor="middle">복구 가능한</text><text x="95" y="119" font-size="22" fill="#17263c" font-weight="500" text-anchor="middle">데이터 시점</text><path d="M300 145 L300 195" stroke="#2858b6" stroke-width="2.5" fill="none"/><text x="300" y="88" font-size="22" fill="#17263c" font-weight="500" text-anchor="middle">장애 발생</text><path d="M510 145 L510 195" stroke="#2858b6" stroke-width="2.5" fill="none"/><text x="510" y="88" font-size="22" fill="#17263c" font-weight="500" text-anchor="middle">서비스 복구</text><path d="M95 235 L294 235" fill="none" stroke="#2858b6" stroke-width="2.5" stroke-linejoin="round"/><path d="M284.00 230.00 L294 235 L284.00 240.00" fill="none" stroke="#2858b6" stroke-width="2.5"/><path d="M105.00 240.00 L95 235 L105.00 230.00" fill="none" stroke="#2858b6" stroke-width="2.5"/><path d="M306 235 L510 235" fill="none" stroke="#2858b6" stroke-width="2.5" stroke-linejoin="round"/><path d="M500.00 230.00 L510 235 L500.00 240.00" fill="none" stroke="#2858b6" stroke-width="2.5"/><path d="M316.00 240.00 L306 235 L316.00 230.00" fill="none" stroke="#2858b6" stroke-width="2.5"/><text x="197" y="275" font-size="22" fill="#2858b6" font-weight="500" text-anchor="middle">데이터 손실 구간</text><text x="405" y="275" font-size="22" fill="#2858b6" font-weight="650" text-anchor="middle">복구 소요시간</text><rect x="315" y="305" width="240" height="55" rx="5" fill="#e8f4ee" stroke="#2858b6" stroke-width="2.5"/><text x="435.0" y="3