chor="middle">여러 제도와 연결</text><path d="M300 90 L300 125 L495 125 L495 165" fill="none" stroke="#2858b6" stroke-width="2.5" stroke-linejoin="round"/><path d="M500.00 155.00 L495 165 L490.00 155.00" fill="none" stroke="#2858b6" stroke-width="2.5"/><text x="300" y="383" font-size="23" fill="#17654a" font-weight="500" text-anchor="middle">보호 대상 · 요건 · 권리 범위를 구분</text></g></svg>
