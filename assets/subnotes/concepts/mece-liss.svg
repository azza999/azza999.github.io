<svg xmlns="http://www.w3.org/2000/svg" width="600" height="370" viewBox="0 0 600 370" role="img" aria-labelledby="title desc">
<title id="title">MECE의 전체 분류와 수업상 LISS의 선택</title><desc id="desc">같은 전체 범위를 A·B·C·D로 겹침과 누락 없이 나누면 MECE다. 수업상 LISS는 중요한 영역을 골라 집중하는 설명이며 수학적 정의와 구분한다.</desc>
<rect width="600" height="370" fill="white"/>
<g font-family="-apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Noto Sans KR', 'Malgun Gothic', sans-serif"><text x="300" y="35" font-size="24" fill="#17263c" font-weight="650" text-anchor="middle">같은 전체 범위: A + B + C + D</text><text x="84" y="127" font-size="24" fill="#17263c" font-weight="700" text-anchor="middle">MECE</text><text x="84" y="258" font-size="23" fill="#17263c" font-weight="700" text-anchor="middle">수업상</text><text x="84" y="290" font-size="23" fill="#17263c" font-weight="700" text-anchor="middle">LISS</text><rect x="180" y="80" width="95" height="85" rx="5" fill="#eef3fc" stroke="#2858b6" stroke-width="2.5"/><text x="227.5" y="132.3" font-size="28" fill="#17263c" font-weight="600" text-anchor="middle">A</text><rect x="180" y="220" width="95" height="85" rx="5" fill="#e8f4ee" stroke="#2858b6" stroke-width="2.5"/><text x="227.5" y="272.3" font-size="28" fill="#17263c" font-weight="600" text-anchor="middle">A</text><rect x="275" y="80" width="95" height="85" rx="5" fill="#eef3fc" stroke="#2858b6" stroke-width="2.5"/><text x="322.5" y="132.3" font-size="28" fill="#17263c" font-weight="600" text-anchor="middle">B</text><rect x="275" y="220" width="95" height="85" rx="5" fill="white" stroke="#2858b6" stroke-width="2.5"/><text x="322.5" y="272.3" font-size="28" fill="#17263c" font-weight="600" text-anchor="middle">B</text><rect x="370" y="80" width="95" height="85" rx="5" fill="#eef3fc" stroke="#2858b6" stroke-width="2.5"/><text x="417.5" y="132.3" font-size="28" fill="#17263c" font-weight="600" text-anchor="middle">C</text><rect x="370" y="220" width="95" height="85" rx="5" fill="#e8f4ee" stroke="#2858b6" stroke-width="2.5"/><text x="417.5" y="272.3" font-size="28" fill="#17263c" font-weight="600" text-anchor="middle">C</text><rect x="465" y="80" width="95" height="85" rx="5" fill="#eef3fc" stroke="#2858b6" stroke-width="2.5"/><text x="512.5" y="132.3" font-size="28" fill="#17263c" font-weight="600" text-anchor="middle">D</text><rect x="465" y="220" width="95" height="85" rx="5" fill="white" stroke="#2858b6" stroke-width="2.5"/><text x="512.5" y="272.3" font-size="28" fill="#17263c" font-weight="600" text-anchor="middle">D</text><text x="365" y="196" font-size="22" fill="#17654a" font-weight="500" text-anchor="middle">중복 없이 · 빠짐없이</text><text x="365" y="344" font-size="22" fill="#17654a" font-weight="500" text-anchor="middle">선택 근거와 제외 영역을 명시</text></g></svg>
