<svg xmlns="http://www.w3.org/2000/svg" width="600" height="290" viewBox="0 0 600 290" role="img" aria-labelledby="title desc">
<title id="title">다크패턴이 선택을 왜곡하는 경로</title><desc id="desc">소비자의 선택 화면에 정보 은폐·오도·압박·방해를 넣으면 이해와 선택이 왜곡돼 원치 않는 결제나 해지 실패로 이어질 수 있다.</desc>
<rect width="600" height="290" fill="white"/>
<g font-family="-apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Noto Sans KR', 'Malgun Gothic', sans-serif"><rect x="28.0" y="50" width="164" height="96" rx="5" fill="#eef3fc" stroke="#2858b6" stroke-width="2.5"/><text x="110.0" y="90.05" font-size="23" fill="#17263c" font-weight="600" text-anchor="middle">소비자</text><text x="110.0" y="122.05" font-size="23" fill="#17263c" font-weight="600" text-anchor="middle">선택 화면</text><rect x="218.0" y="50" width="164" height="96" rx="5" fill="#eef3fc" stroke="#2858b6" stroke-width="2.5"/><text x="300.0" y="90.05" font-size="23" fill="#17263c" font-weight="600" text-anchor="middle">숨김·오도</text><text x="300.0" y="122.05" font-size="23" fill="#17263c" font-weight="600" text-anchor="middle">압박·방해</text><rect x="408.0" y="50" width="164" height="96" rx="5" fill="#eef3fc" stroke="#2858b6" stroke-width="2.5"/><text x="490.0" y="90.05" font-size="23" fill="#17263c" font-weight="600" text-anchor="middle">선택 왜곡</text><text x="490.0" y="122.05" font-size="23" fill="#17263c" font-weight="600" text-anchor="middle">원치 않는 결과</text><path d="M192.0 98 L218.0 98" fill="none" stroke="#2858b6" stroke-width="2.5" stroke-linejoin="round"/><path d="M208.00 93.00 L218.0 98 L208.00 103.00" fill="none" stroke="#2858b6" stroke-width="2.5"/><path d="M382.0 98 L408.0 98" fill="none" stroke="#2858b6" stroke-width="2.5" stroke-linejoin="round"/><path d="M398.00 93.00 L408.0 98 L398.00 103.00" fill="none" stroke="#2858b6" stroke-width="2.5"/><text x="300" y="250" font-size="22" fill="#17654a" font-weight="500" text-anchor="middle">명확한 정보 · 대칭적인 선택 · 쉬운 취소</text></g></svg>
