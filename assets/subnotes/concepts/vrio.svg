<svg xmlns="http://www.w3.org/2000/svg" width="600" height="460" viewBox="0 0 600 460" role="img" aria-labelledby="title desc">
<title id="title">VRIO가 묻는 네 가지 조건</title><desc id="desc">자원·역량에 대해 가치·희소성·모방 곤란성·조직적 활용의 네 질문을 차례로 검토한다.</desc>
<rect width="600" height="460" fill="white"/>
<g font-family="-apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Noto Sans KR', 'Malgun Gothic', sans-serif"><rect x="28.0" y="50" width="240" height="96" rx="5" fill="#eef3fc" stroke="#2858b6" stroke-width="2.5"/><text x="148.0" y="90.05" font-size="23" fill="#17263c" font-weight="600" text-anchor="middle">V · 가치</text><text x="148.0" y="122.05" font-size="23" fill="#17263c" font-weight="600" text-anchor="middle">기회·위협 대응</text><rect x="332.0" y="50" width="240" height="96" rx="5" fill="#eef3fc" stroke="#2858b6" stroke-width="2.5"/><text x="452.0" y="90.05" font-size="23" fill="#17263c" font-weight="600" text-anchor="middle">R · 희소성</text><text x="452.0" y="122.05" font-size="23" fill="#17263c" font-weight="600" text-anchor="middle">흔하지 않은가</text><rect x="332.0" y="222" width="240" height="96" rx="5" fill="#eef3fc" stroke="#2858b6" stroke-width="2.5"/><text x="452.0" y="262.05" font-size="23" fill="#17263c" font-weight="600" text-anchor="middle">I · 모방 곤란</text><text x="452.0" y="294.05" font-size="23" fill="#17263c" font-weight="600" text-anchor="middle">복제 비용·시간</text><rect x="28.0" y="222" width="240" height="96" rx="5" fill="#eef3fc" stroke="#2858b6" stroke-width="2.5"/><text x="148.0" y="262.05" font-size="23" fill="#17263c" font-weight="600" text-anchor="middle">O · 조직</text><text x="148.0" y="294.05" font-size="23" fill="#17263c" font-weight="600" text-anchor="middle">가치를 활용</text><path d="M268.0 98 L332.0 98" fill="none" stroke="#2858b6" stroke-width="2.5" stroke-linejoin="round"/><path d="M322.00 93.00 L332.0 98 L322.00 103.00" fill="none" stroke="#2858b6" stroke-width="2.5"/><path d="M452.0 146 L452.0 222" fill="none" stroke="#2858b6" stroke-width="2.5" stroke-linejoin="round"/><path d="M457.00 212.00 L452.0 222 L447.00 212.00" fill="none" stroke="#2858b6" stroke-width="2.5"/><path d="M332.0 270 L268.0 270" fill="none" stroke="#2858b6" stroke-width="2.5" stroke-linejoin="round"/><path d="M278.00 275.00 L268.0 270 L278.00 265.00" fill="none" stroke="#2858b6" stroke-width="2.5"/><text x="300" y="420" font-size="22" fill="#17654a" font-weight="500" text-anchor="middle">네 조건의 근거를 함께 평가</text></g></svg>
