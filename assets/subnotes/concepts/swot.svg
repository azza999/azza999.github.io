<svg xmlns="http://www.w3.org/2000/svg" width="600" height="420" viewBox="0 0 600 420" role="img" aria-labelledby="title desc">
<title id="title">SWOT의 내부·외부 교차행렬</title><desc id="desc">열은 내부 강점 S와 약점 W, 행은 외부 기회 O와 위협 T다. 교차점에서 SO·WO·ST·WT 전략을 도출한다.</desc>
<rect width="600" height="420" fill="white"/>
<g font-family="-apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Noto Sans KR', 'Malgun Gothic', sans-serif"><text x="310" y="35" font-size="24" fill="#17654a" font-weight="500" text-anchor="middle">내부 요인</text><text x="238" y="89" font-size="25" fill="#17263c" font-weight="700" text-anchor="middle">S · 강점</text><text x="455" y="89" font-size="25" fill="#17263c" font-weight="700" text-anchor="middle">W · 약점</text><text x="68" y="190" font-size="23" fill="#17263c" font-weight="500" text-anchor="middle">O</text><text x="68" y="222" font-size="23" fill="#17263c" font-weight="500" text-anchor="middle">기회</text><text x="68" y="320" font-size="23" fill="#17263c" font-weight="500" text-anchor="middle">T</text><text x="68" y="352" font-size="23" fill="#17263c" font-weight="500" text-anchor="middle">위협</text><rect x="130" y="120" width="215" height="125" rx="5" fill="#eef3fc" stroke="#2858b6" stroke-width="2.5"/><text x="237.5" y="174.7" font-size="22" fill="#17263c" font-weight="600" text-anchor="middle">SO</text><text x="237.5" y="205.7" font-size="22" fill="#17263c" font-weight="600" text-anchor="middle">강점으로 기회 활용</text><rect x="350" y="120" width="215" height="125" rx="5" fill="#eef3fc" stroke="#2858b6" stroke-width="2.5"/><text x="457.5" y="174.7" font-size="22" fill="#17263c" font-weight="600" text-anchor="middle">WO</text><text x="457.5" y="205.7" font-size="22" fill="#17263c" font-weight="600" text-anchor="middle">약점 보완·기회 활용</text><rect x="130" y="255" width="215" height="125" rx="5" fill="#eef3fc" stroke="#2858b6" stroke-width="2.5"/><text x="237.5" y="309.7" font-size="22" fill="#17263c" font-weight="600" text-anchor="middle">ST</text><text x="237.5" y="340.7" font-size="22" fill="#17263c" font-weight="600" text-anchor="middle">강점으로 위협 대응</text><rect x="350" y="255" width="215" height="125" rx="5" fill="#eef3fc" stroke="#2858b6" stroke-width="2.5"/><text x="457.5" y="309.7" font-size="22" fill="#17263c" font-weight="600" text-anchor="middle">WT</text><text x="457.5" y="340.7" font-size="22" fill="#17263c" font-weight="600" text-anchor="middle">약점·위협 최소화</text></g></svg>
