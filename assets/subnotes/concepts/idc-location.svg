<title id="title">위험 분리와 복구 가능성을 함께 보는 선정 흐름</title><desc id="desc">IDC 입지와 복구 전략은 재난·지정학 위험, 전력·통신 의존성, 거리·복제 지연, 운영·인력·비용을 함께 고려해 RTO·RPO 달성 여부로 검증한다.</desc>
