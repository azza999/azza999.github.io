oke-width="2.5"/><rect x="410" y="35" width="170" height="70" rx="5" fill="#eef3fc" stroke="#2858b6" stroke-width="2.5"/><text x="495.0" y="78.75" font-size="25" fill="#17263c" font-weight="600" text-anchor="middle">G · 지배구조</text><rect x="410" y="165" width="170" height="100" rx="5" fill="#eef3fc" stroke="#2858b6" stroke-width="2.5"/><text x="495.0" y="207.2" font-size="22" fill="#17263c" font-weight="600" text-anchor="middle">책임·윤리</text><text x="495.0" y="238.2" font-size="22" fill="#17263c" font-weight="600" text-anchor="middle">통제·공시</text><path d="M495 105 L495 165" fill="none" stroke="#2858b6" stroke-width="2.5" stroke-linejoin="round"/><path d="M500.00 155.00 L495 165 L490.00 155.00" fill="none" stroke="#2858b6" stroke-width="2.5"/><path d="M495 265 L495 305 L300 305 L300 340" fill="none" stroke="#2858b6" stroke-width="2.5" stroke-linejoin="round"/><path d="M305.00 330.00 L300 340 L295.00 330.00" fill="none" stroke="#2858b6" stroke-width="2.5"/><rect x="100" y="340" width="400" height="55" rx="5" fill="#e8f4ee" stroke="#2858b6" stroke-width="2.5"/><text x="300.0" y="375.55" font-size="23" fill="#17263c" font-weight="600" text-anchor="middle">지속가능 경영 · 지표와 증거</text></g></svg>
