<svg xmlns="http://www.w3.org/2000/svg" width="600" height="390" viewBox="0 0 600 390" role="img" aria-labelledby="title desc">
<title id="title">데이터 마이닝의 발견과 예측</title><desc id="desc">데이터에서 패턴을 추출하는 데이터 마이닝은 예측과 기술·발견으로 나눠 볼 수 있다. 예측에는 분류·회귀, 발견에는 군집·연관규칙이 있다.</desc>
<rect width="600" height="390" fill="white"/>
<g font-family="-apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Noto Sans KR', 'Malgun Gothic', sans-serif"><rect x="160" y="20" width="280" height="70" rx="5" fill="#eef3fc" stroke="#2858b6" stroke-width="2.5"/><text x="300.0" y="63.4" font-size="24" fill="#17263c" font-weight="600" text-anchor="middle">데이터 마이닝</text><rect x="25" y="170" width="245" height="80" rx="5" fill="#eef3fc" stroke="#2858b6" stroke-width="2.5"/><text x="147.5" y="218.4" font-size="24" fill="#17263c" font-weight="600" text-anchor="middle">예측</text><rect x="330" y="170" width="245" height="80" rx="5" fill="#e8f4ee" stroke="#2858b6" stroke-width="2.5"/><text x="452.5" y="218.4" font-size="24" fill="#17263c" font-weight="600" text-anchor="middle">기술·발견</text><path d="M300 90 L300 125 L147 125 L147 170" fill="none" stroke="#2858b6" stroke-width="2.5" stroke-linejoin="round"/><path d="M152.00 160.00 L147 170 L142.00 160.00" fill="none" stroke="#2858b6" stroke-width="2.5"/><path d="M300 125 L452 125 L452 170" fill="none" stroke="#2858b6" stroke-width="2.5" stroke-linejoin="round"/><path d="M457.00 160.00 L452 170 L447.00 160.00" fill="none" stroke="#2858b6" stroke-width="2.5"/><text x="147" y="305" font-size="22" fill="#17263c" font-weight="500" text-anchor="middle">분류 · 회귀</text><text x="147" y="336" font-size="22" fill="#17263c" font-weight="500" text-anchor="middle">미래 값·범주 예측</text><text x="452" y="305" font-size="22" fill="#17263c" font-weight="500" text-anchor="middle">군집 · 연관규칙</text><text x="452" y="336" font-size="22" fill="#17263c" font-weight="500" text-anchor="middle">숨은 구조·관계 발견</text></g></svg>
