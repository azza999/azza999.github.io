<title id="title">목표·핵심결과·실행과제의 연결</title><desc id="desc">원하는 상태인 Objective 아래에 측정 가능한 핵심결과를 두고, 실행과제는 그 결과에 기여하도록 연결한다. 실행 완료와 결과 달성을 구분한다.</desc>
