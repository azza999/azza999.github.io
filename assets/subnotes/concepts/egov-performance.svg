.5"/><path d="M145 265 L145 145" fill="none" stroke="#2858b6" stroke-width="2.5" stroke-linejoin="round"/><path d="M140.00 155.00 L145 145 L150.00 155.00" fill="none" stroke="#2858b6" stroke-width="2.5"/><text x="300" y="209" font-size="23" fill="#17654a" font-weight="650" text-anchor="middle">검토 · 개선</text></g></svg>
