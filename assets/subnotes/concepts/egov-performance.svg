<svg xmlns="http://www.w3.org/2000/svg" width="600" height="440" viewBox="0 0 600 440" role="img" aria-labelledby="title desc">
<title id="title">전자정부사업의 검토·운영·정비 순환</title><desc id="desc">사전협의로 중복과 연계를 검토하고 사업을 추진한다. 운영 중 비용·업무 성과를 측정·평가하고 정비 결과를 다음 사업과 운영에 반영한다.</desc>
<rect width="600" height="440" fill="white"/>
