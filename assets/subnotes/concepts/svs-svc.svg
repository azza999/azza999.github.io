<svg xmlns="http://www.w3.org/2000/svg" width="600" height="590" viewBox="0 0 600 590" role="img" aria-labelledby="title desc">
<title id="title">SVS 안의 SVC와 가치흐름</title><desc id="desc">수요·기회가 SVS에 들어와 가치로 연결된다. SVS의 지도 원칙·거버넌스·프랙티스·지속 개선 안에서 SVC 6활동을 시나리오에 맞게 조합한다.</desc>
<rect width="600" height="590" fill="white"/>
