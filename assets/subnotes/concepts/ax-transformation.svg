<svg xmlns="http://www.w3.org/2000/svg" width="600" height="430" viewBox="0 0 600 430" role="img" aria-labelledby="title desc">
<title id="title">AX와 수업상 AX 2.0의 전환 구조</title><desc id="desc">AX는 AI를 중심으로 업무와 의사결정을 재설계하는 조직 전환이다. 수업의 AX 2.0은 생성 보조를 넘어 계획·실행·협업하는 AI를 강조하며 사람의 감독과 평가를 함께 둔다.</desc>
<rect width="600" height="430" fill="white"/>
<g font-family="-apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Noto Sans KR', 'Malgun Gothic', sans-serif"><rect x="35" y="30" width="530" height="65" rx="5" fill="#eef3fc" stroke="#2858b6" stroke-width="2.5"/><text x="300.0" y="70.9" font-size="24" fill="#17263c" font-weight="600" text-anchor="middle">AX · 업무·조직·의사결정 재설계</text><rect x="35" y="150" width="235" height="115" rx="5" fill="#eef3fc" stroke="#2858b6" stroke-width="2.5"/><text x="152.5" y="199.4" font-size="24" fill="#17263c" font-weight="600" text-anchor="middle">AI 생성·분석 보조</text><text x="152.5" y="232.4" font-size="24" fill="#17263c" font-weight="600" text-anchor="middle">사람이 실행</text><rect x="330" y="150" width="235" height="115" rx="5" fill="#eef3fc" stroke="#2858b6" stroke-width="2.5"/><text x="447.5" y="199.4" font-size="24" fill="#17263c" font-weight="600" text-anchor="middle">계획·도구 실행</text><text x="447.5" y="232.4" font-size="24" fill="#17263c" font-weight="600" text-anchor="middle">협업·현장 연결</text><path d="M270 207 L330 207" fill="none" stroke="#2858b6" stroke-width="2.5" stroke-linejoin="round"/><path d="M320.00 202.00 L330 207 L320.00 212.00" fill="none" stroke="#2858b6" stroke-width="2.5"/><text x="300" y="128" font-size="22" fill="#17263c" font-weight="500" text-anchor="middle">수업상 확장</text><text x="447" y="304" font-size="22" fill="#17654a" font-weight="650" text-anchor="middle">AX 2.0의 강조점</text><rect x="35" y="350" width="530" height="60" rx="5" fill="#eef3fc" stroke="#2858b6" stroke-width="2.5"/><text x="300.0" y="388.05" font-size="23" fill="#17263c" font-weight="600" text-anchor="middle">공통 기반: 데이터·평가·권한·사람의 감독</text></g></svg>
