<svg xmlns="http://www.w3.org/2000/svg" width="600" height="450" viewBox="0 0 600 450" role="img" aria-labelledby="title desc">
<title id="title">BCM의 관리 범위와 계획의 포함관계</title><desc id="desc">BCM의 지속적 관리 안에 BIA와 BCP가 있고, BCP 중 IT 복구 계획이 DRP다. DRP는 DRS와 인력·절차로 실행한다.</desc>
<rect width="600" height="450" fill="white"/>
<g font-family="-apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Noto Sans KR', 'Malgun Gothic', sans-serif"><rect x="25" y="25" width="550" height="390" rx="5" fill="#eef3fc" stroke="#2858b6" stroke-width="2.5"/><text x="300" y="65" font-size="25" fill="#17263c" font-weight="700" text-anchor="middle">BCM · 지속적인 연속성 관리</text><rect x="55" y="95" width="490" height="65" rx="5" fill="white" stroke="#2858b6" stroke-width="2.5"/><text x="300.0" y="135.9" font-size="24" fill="#17263c" font-weight="600" text-anchor="middle">BIA · 핵심 업무와 복구 목표</text><path d="M300 160 L300 193" fill="none" stroke="#2858b6" stroke-width="2.5" stroke-linejoin="round"/><path d="M305.00 183.00 L300 193 L295.00 183.00" fill="none" stroke="#2858b6" stroke-width="2.5"/><rect x="55" y="195" width="490" height="190" rx="5" fill="white" stroke="#2858b6" stroke-width="2.5"/><text x="300" y="232" font-size="24" fill="#17263c" font-weight="600" text-anchor="middle">BCP · 사람·장소·업무의 지속 계획</text><rect x="95" y="259" width="410" height="66" rx="5" fill="#eef3fc" stroke="#2858b6" stroke-width="2.5"/><text x="300.0" y="300.4" font-size="24" fill="#17263c" font-weight="600" text-anchor="middle">DRP · IT 재해복구 계획</text><text x="300" y="361" font-size="23" fill="#17654a" font-weight="500" text-anchor="middle">실행 수단: DRS + 인력·절차</text></g></svg>
