<svg xmlns="http://www.w3.org/2000/svg" width="600" height="390" viewBox="0 0 600 390" role="img" aria-labelledby="title desc">
<title id="title">디지털 카르텔의 가격 상호작용</title><desc id="desc">여러 기업의 가격결정 알고리즘이 가격 정보를 관찰하고 반응한다. 공통 알고리즘·신호·학습 방식 등이 경쟁 제한 위험을 만들 수 있으나 같은 가격만으로 담합을 단정하지 않는다.</desc>
<rect width="600" height="390" fill="white"/>
