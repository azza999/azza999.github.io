<svg xmlns="http://www.w3.org/2000/svg" width="600" height="290" viewBox="0 0 600 290" role="img" aria-labelledby="title desc">
<title id="title">딥테크의 연구·실증·사업화 연결</title><desc id="desc">과학·공학의 원천기술을 연구하고 재현 가능한 성능과 시제품을 검증한 뒤 현장·양산·시장 검증을 거쳐 사업화한다.</desc>
<rect width="600" height="290" fill="white"/>
