<svg xmlns="http://www.w3.org/2000/svg" width="600" height="290" viewBox="0 0 600 290" role="img" aria-labelledby="title desc">
<title id="title">이벤트 로그에서 실제 프로세스와 개선 근거로</title><desc id="desc">업무 건·활동·시간 로그를 정리해 실제 흐름을 발견하고, 모델과 비교·분석해 병목·재작업·이탈을 확인한다.</desc>
<rect width="600" height="290" fill="white"/>
<g font-family="-apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Noto Sans KR', 'Malgun Gothic', sans-serif"><rect x="28.0" y="50" width="164" height="96" rx="5" fill="#eef3fc" stroke="#2858b6" stroke-width="2.5"/><text x="110.0" y="90.05" font-size="23" fill="#17263c" font-weight="600" text-anchor="middle">이벤트 로그</text><text x="110.0" y="122.05" font-size="23" fill="#17263c" font-weight="600" text-anchor="middle">건·활동·시간</text><rect x="218.0" y="50" width="164" height="96" rx="5" fill="#eef3fc" stroke="#2858b6" stroke-width="2.5"/><text x="300.0" y="90.05" font-size="23" fill="#17263c" font-weight="600" text-anchor="middle">프로세스 분석</text><text x="300.0" y="122.05" font-size="23" fill="#17263c" font-weight="600" text-anchor="middle">발견·적합·개선</text><rect x="408.0" y="50" width="164" height="96" rx="5" fill="#eef3fc" stroke="#2858b6" stroke-width="2.5"/><text x="490.0" y="90.05" font-size="23" fill="#17263c" font-weight="600" text-anchor="middle">개선 근거</text><text x="490.0" y="122.05" font-size="23" fill="#17263c" font-weight="600" text-anchor="middle">병목·재작업</text><path d="M192.0 98 L218.0 98" fill="none" stroke="#2858b6" stroke-width="2.5" stroke-linejoin="round"/><path d="M208.00 93.00 L218.0 98 L208.00 103.00" fill="none" stroke="#2858b6" stroke-width="2.5"/><path d="M382.0 98 L408.0 98" fill="none" stroke="#2858b6" stroke-width="2.5" stroke-linejoin="round"/><path d="M398.00 93.00 L408.0 98 L398.00 103.00" fill="none" stroke="#2858b6" stroke-width="2.5"/><text x="300" y="250" font-size="22" fill="#17654a" font-weight="500" text-anchor="middle">설계된 흐름과 실제 흐름을 구분</text></g></svg>
