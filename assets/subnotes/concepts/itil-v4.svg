<svg xmlns="http://www.w3.org/2000/svg" width="600" height="465" viewBox="0 0 600 465" role="img" aria-labelledby="title desc">
<title id="title">ITIL 4의 4차원과 서비스 가치</title><desc id="desc">서비스 가치를 중심으로 조직·사람, 정보·기술, 파트너·공급자, 가치흐름·프로세스 네 측면을 함께 고려한다. SVS와 프랙티스는 이를 운영 활동으로 연결한다.</desc>
<rect width="600" height="465" fill="white"/>
