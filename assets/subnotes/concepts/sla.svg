<svg xmlns="http://www.w3.org/2000/svg" width="600" height="410" viewBox="0 0 600 410" role="img" aria-labelledby="title desc">
<title id="title">SLA의 약속·측정·미달 조치</title><desc id="desc">고객과 제공자가 서비스 범위·목표·측정 기준·책임·미달 조치를 합의한다. 실제 측정 결과를 보고하고 합의 기준에 따라 개선한다.</desc>
<rect width="600" height="410" fill="white"/>
<g font-family="-apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Noto Sans KR', 'Malgun Gothic', sans-serif"><rect x="25" y="25" width="210" height="70" rx="5" fill="#eef3fc" stroke="#2858b6" stroke-width="2.5"/><text x="130.0" y="68.4" font-size="24" fill="#17263c" font-weight="600" text-anchor="middle">고객</text><rect x="365" y="25" width="210" height="70" rx="5" fill="#eef3fc" stroke="#2858b6" stroke-width="2.5"/><text x="470.0" y="68.4" font-size="24" fill="#17263c" font-weight="600" text-anchor="middle">서비스 제공자</text><path d="M235 60 L365 60" fill="none" stroke="#2858b6" stroke-width="2.5" stroke-linejoin="round"/><path d="M355.00 55.00 L365 60 L355.00 65.00" fill="none" stroke="#2858b6" stroke-width="2.5"/><path d="M245.00 65.00 L235 60 L245.00 55.00" fill="none" stroke="#2858b6" stroke-width="2.5"/><text x="300" y="111" font-size="23" fill="#17263c" font-weight="500" text-anchor="middle">합의</text><rect x="60" y="150" width="480" height="100" rx="5" fill="#eef3fc" stroke="#2858b6" stroke-width="2.5"/><text x="300.0" y="191.9" font-size="24" fill="#17263c" font-weight="600" text-anchor="middle">SLA</text><text x="300.0" y="224.9" font-size="24" fill="#17263c" font-weight="600" text-anchor="middle">범위·목표·측정·책임·미달 조치</text><path d="M300 250 L300 290" fill="none" stroke="#2858b6" stroke-width="2.5" stroke-linejoin="round"/><path d="M305.00 280.00 L300 290 L295.00 280.00" fill="none" stroke="#2858b6" stroke-width="2.5"/><rect x="60" y="290" width="480" height="90" rx="5" fill="#eef3fc" stroke="#2858b6" stroke-width="2.5"/><text x="300.0" y="343.05" font-size="23" fill="#17263c" font-weight="600" text-anchor="middle">측정·보고 → 기준 대비 판단 → 조치</text></g></svg>
