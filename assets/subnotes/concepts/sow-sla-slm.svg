<svg xmlns="http://www.w3.org/2000/svg" width="600" height="350" viewBox="0 0 600 350" role="img" aria-labelledby="title desc">
<title id="title">범위를 약속으로, 약속을 실제 관리로</title><desc id="desc">SoW가 수행 범위·책임을 정하고 SLA가 서비스 수준을 합의한다. SLM은 운영 결과를 측정·평가·개선해 다음 합의에 반영한다.</desc>
<rect width="600" height="350" fill="white"/>
<g font-family="-apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Noto Sans KR', 'Malgun Gothic', sans-serif"><rect x="20" y="50" width="164" height="96" rx="5" fill="#eef3fc" stroke="#2858b6" stroke-width="2.5"/><text x="102.0" y="90.05" font-size="23" fill="#17263c" font-weight="600" text-anchor="middle">SoW</text><text x="102.0" y="122.05" font-size="23" fill="#17263c" font-weight="600" text-anchor="middle">범위·책임</text><rect x="210" y="50" width="164" height="96" rx="5" fill="#eef3fc" stroke="#2858b6" stroke-width="2.5"/><text x="292.0" y="90.05" font-size="23" fill="#17263c" font-weight="600" text-anchor="middle">SLA</text><text x="292.0" y="122.05" font-size="23" fill="#17263c" font-weight="600" text-anchor="middle">수준·측정 합의</text><rect x="400" y="50" width="164" height="96" rx="5" fill="#eef3fc" stroke="#2858b6" stroke-width="2.5"/><text x="482.0" y="90.05" font-size="23" fill="#17263c" font-weight="600" text-anchor="middle">SLM</text><text x="482.0" y="122.05" font-size="23" fill="#17263c" font-weight="600" text-anchor="middle">지속 수준관리</text><path d="M184 98 L210 98" fill="none" stroke="#2858b6" stroke-width="2.5" stroke-linejoin="round"/><path d="M200.00 93.00 L210 98 L200.00 103.00" fill="none" stroke="#2858b6" stroke-width="2.5"/><path d="M374 98 L400 98" fill="none" stroke="#2858b6" stroke-width="2.5" stroke-linejoin="round"/><path d="M390.00 93.00 L400 98 L390.00 103.00" fill="none" stroke="#2858b6" stroke-width="2.5"/><path d="M482 146 L482 205 L102 205 L102 146" fill="none" stroke="#2858b6" stroke-width="2.5" stroke-linejoin="round" stroke-dasharray="7 5"/><path d="M97.00 156.00 L102 146 L107.00 156.00" fill="none" stroke="#2858b6" stroke-width="2.5"/><text x="300" y="255" font-size="23" fill="#17654a" font-weight="500" text-anchor="middle">운영 결과를 범위·약속에 환류</text><text x="300" y="315" font-size="21" fill="#17263c" font-weight="500" text-anchor="middle">SLM은 요구 파악·협상부터 관여</text></g></svg>
