<svg xmlns="http://www.w3.org/2000/svg" width="600" height="425" viewBox="0 0 600 425" role="img" aria-labelledby="title desc">
<title id="title">국내 오픈뱅킹의 서비스 연결 관계</title><desc id="desc">이용자의 동의·인증을 받아 이용기관이 공동 플랫폼의 표준 API를 통해 참가기관의 금융 기능을 이용하며 결과를 전달받는다.</desc>
