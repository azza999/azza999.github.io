 L270 295" fill="none" stroke="#2858b6" stroke-width="2.5" stroke-linejoin="round"/><path d="M280.00 300.00 L270 295 L280.00 290.00" fill="none" stroke="#2858b6" stroke-width="2.5"/><path d="M320.00 290.00 L330 295 L320.00 300.00" fill="none" stroke="#2858b6" stroke-width="2.5"/><text x="260" y="200" font-size="22" fill="#17654a" font-weight="500" text-anchor="middle">동의한 기능·범위 안에서 연결</text><text x="300" y="400" font-size="22" fill="#17654a" font-weight="500" text-anchor="middle">요청과 결과 · 인증·권한·거래 보호</text></g></svg>
