<svg xmlns="http://www.w3.org/2000/svg" width="600" height="290" viewBox="0 0 600 290" role="img" aria-labelledby="title desc">
<title id="title">QX의 적용 탐색과 검증</title><desc id="desc">양자 계산·통신·센싱의 영역을 나누고 적합 업무를 탐색한 뒤 고전 방법과 실증 비교해 적용·준비 계획을 세운다.</desc>
<rect width="600" height="290" fill="white"/>
<g font-family="-apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Noto Sans KR', 'Malgun Gothic', sans-serif"><rect x="28.0" y="50" width="164" height="96" rx="5" fill="#eef3fc" stroke="#2858b6" stroke-width="2.5"/><text x="110.0" y="90.05" font-size="23" fill="#17263c" font-weight="600" text-anchor="middle">기술·업무</text><text x="110.0" y="122.05" font-size="23" fill="#17263c" font-weight="600" text-anchor="middle">양자 영역 구분</text><rect x="218.0" y="50" width="164" height="96" rx="5" fill="#eef3fc" stroke="#2858b6" stroke-width="2.5"/><text x="300.0" y="90.05" font-size="23" fill="#17263c" font-weight="600" text-anchor="middle">비교·실증</text><text x="300.0" y="122.05" font-size="23" fill="#17263c" font-weight="600" text-anchor="middle">고전 기준선</text><rect x="408.0" y="50" width="164" height="96" rx="5" fill="#eef3fc" stroke="#2858b6" stroke-width="2.5"/><text x="490.0" y="90.05" font-size="23" fill="#17263c" font-weight="600" text-anchor="middle">적용·준비</text><text x="490.0" y="122.05" font-size="23" fill="#17263c" font-weight="600" text-anchor="middle">효과·위험·인력</text><path d="M192.0 98 L218.0 98" fill="none" stroke="#2858b6" stroke-width="2.5" stroke-linejoin="round"/><path d="M208.00 93.00 L218.0 98 L208.00 103.00" fill="none" stroke="#2858b6" stroke-width="2.5"/><path d="M382.0 98 L408.0 98" fill="none" stroke="#2858b6" stroke-width="2.5" stroke-linejoin="round"/><path d="M398.00 93.00 L408.0 98 L398.00 103.00" fill="none" stroke="#2858b6" stroke-width="2.5"/><text x="300" y="250" font-size="22" fill="#17654a" font-weight="500" text-anchor="middle">보편적 표준 단계가 아닌 학습용 전환 틀</text></g></svg>
