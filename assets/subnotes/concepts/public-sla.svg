<svg xmlns="http://www.w3.org/2000/svg" width="600" height="460" viewBox="0 0 600 460" role="img" aria-labelledby="title desc">
<title id="title">공공 SLA의 중요도·약속·측정·조치 연결</title><desc id="desc">중요도와 적용 등급을 확인한 뒤 가용률·복구 등 서비스 수준을 합의한다. 같은 기준으로 측정·보고하고 미달 조치와 개선을 수행한다.</desc>
