<svg xmlns="http://www.w3.org/2000/svg" width="600" height="400" viewBox="0 0 600 400" role="img" aria-labelledby="title desc">
<title id="title">외부 조건과 내부 역량을 전략으로 연결</title><desc id="desc">외부에서는 기회·위협을, 내부에서는 자원·역량의 강점·약점을 분석한다. 두 결과를 연결해 전략 대안을 도출하고 실행 가능성을 비교한다.</desc>
<rect width="600" height="400" fill="white"/>
<g font-family="-apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Noto Sans KR', 'Malgun Gothic', sans-serif"><rect x="30" y="35" width="240" height="110" rx="5" fill="#eef3fc" stroke="#2858b6" stroke-width="2.5"/><text x="150.0" y="81.9" font-size="24" fill="#17263c" font-weight="600" text-anchor="middle">외부환경</text><text x="150.0" y="114.9" font-size="24" fill="#17263c" font-weight="600" text-anchor="middle">기회·위협</text><rect x="330" y="35" width="240" height="110" rx="5" fill="#eef3fc" stroke="#2858b6" stroke-width="2.5"/><text x="450.0" y="81.9" font-size="24" fill="#17263c" font-weight="600" text-anchor="middle">내부환경</text><text x="450.0" y="114.9" font-size="24" fill="#17263c" font-weight="600" text-anchor="middle">강점·약점</text><path d="M150 145 L150 205 L300 205 L300 250" fill="none" stroke="#2858b6" stroke-width="2.5" stroke-linejoin="round"/><path d="M305.00 240.00 L300 250 L295.00 240.00" fill="none" stroke="#2858b6" stroke-width="2.5"/><path d="M450 145 L450 205 L300 205" fill="none" stroke="#2858b6" stroke-width="2.5" stroke-linejoin="round"/><path d="M310.00 210.00 L300 205 L310.00 200.00" fill="none" stroke="#2858b6" stroke-width="2.5"/><rect x="100" y="250" width="400" height="100" rx="5" fill="#eef3fc" stroke="#2858b6" stroke-width="2.5"/><text x="300.0" y="291.9" font-size="24" fill="#17263c" font-weight="600" text-anchor="middle">SWOT · 대안 비교</text><text x="300.0" y="324.9" font-size="24" fill="#17263c" font-weight="600" text-anchor="middle">전략 과제·실행 우선순위</text><text x="300" y="390" font-size="22" fill="#17654a" font-weight="500" text-anchor="middle">같은 기준일·목표·사업 범위에서 분석</text></g></svg>
