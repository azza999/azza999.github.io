<svg xmlns="http://www.w3.org/2000/svg" width="600" height="290" viewBox="0 0 600 290" role="img" aria-labelledby="title desc">
<title id="title">앰비언트 컴퓨팅과 커머스의 연결</title><desc id="desc">센싱·연결로 맥락 데이터를 모으고 분석·판단을 통해 자연스러운 서비스를 제공한다. 상거래에 적용하면 주문·결제 등 앰비언트 커머스가 된다.</desc>
<rect width="600" height="290" fill="white"/>
<g font-family="-apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Noto Sans KR', 'Malgun Gothic', sans-serif"><rect x="28.0" y="50" width="164" height="96" rx="5" fill="#eef3fc" stroke="#2858b6" stroke-width="2.5"/><text x="110.0" y="90.05" font-size="23" fill="#17263c" font-weight="600" text-anchor="middle">센싱·연결</text><text x="110.0" y="122.05" font-size="23" fill="#17263c" font-weight="600" text-anchor="middle">상황 데이터</text><rect x="218.0" y="50" width="164" height="96" rx="5" fill="#eef3fc" stroke="#2858b6" stroke-width="2.5"/><text x="300.0" y="90.05" font-size="23" fill="#17263c" font-weight="600" text-anchor="middle">분석·판단</text><text x="300.0" y="122.05" font-size="23" fill="#17263c" font-weight="600" text-anchor="middle">맥락 인식</text><rect x="408.0" y="50" width="164" height="96" rx="5" fill="#eef3fc" stroke="#2858b6" stroke-width="2.5"/><text x="490.0" y="90.05" font-size="23" fill="#17263c" font-weight="600" text-anchor="middle">서비스 제공</text><text x="490.0" y="122.05" font-size="23" fill="#17263c" font-weight="600" text-anchor="middle">상거래 응용</text><path d="M192.0 98 L218.0 98" fill="none" stroke="#2858b6" stroke-width="2.5" stroke-linejoin="round"/><path d="M208.00 93.00 L218.0 98 L208.00 103.00" fill="none" stroke="#2858b6" stroke-width="2.5"/><path d="M382.0 98 L408.0 98" fill="none" stroke="#2858b6" stroke-width="2.5" stroke-linejoin="round"/><path d="M398.00 93.00 L408.0 98 L398.00 103.00" fill="none" stroke="#2858b6" stroke-width="2.5"/><text x="300" y="250" font-size="22" fill="#17654a" font-weight="500" text-anchor="middle">컴퓨팅 = 기반 · 커머스 = 상거래 응용</text></g></svg>
