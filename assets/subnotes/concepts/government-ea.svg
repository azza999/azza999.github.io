<svg xmlns="http://www.w3.org/2000/svg" width="600" height="400" viewBox="0 0 600 400" role="img" aria-labelledby="title desc">
<title id="title">메타모델·참조모형·성숙도 모델의 서로 다른 역할</title><desc id="desc">범정부 EA의 메타모델은 관리할 정보·관계를, 참조모형은 공통 분류·표준을, 성숙도 모델은 관리 역량의 수준과 개선을 다룬다.</desc>
<rect width="600" height="400" fill="white"/>
<g font-family="-apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Noto Sans KR', 'Malgun Gothic', sans-serif"><rect x="160" y="20" width="280" height="70" rx="5" fill="#eef3fc" stroke="#2858b6" stroke-width="2.5"/><text x="300.0" y="63.4" font-size="24" fill="#17263c" font-weight="600" text-anchor="middle">범정부 EA</text><path d="M300 90 L300 125 L105 125 L105 165" fill="none" stroke="#2858b6" stroke-width="2.5" stroke-linejoin="round"/><path d="M110.00 155.00 L105 165 L100.00 155.00" fill="none" stroke="#2858b6" stroke-width="2.5"/><rect x="20" y="165" width="170" height="70" rx="5" fill="#eef3fc" stroke="#2858b6" stroke-width="2.5"/><text x="105.0" y="208.05" font-size="23" fill="#17263c" font-weight="600" text-anchor="middle">메타모델</text><text x="105" y="290" font-size="21" fill="#17263c" font-weight="500" text-anchor="middle">무엇을 기록?</text><text x="105" y="320" font-size="21" fill="#17263c" font-weight="500" text-anchor="middle">산출물·속성·관계</text><path d="M300 90 L300 125 L300 125 L300 165" fill="none" stroke="#2858b6" stroke-width="2.5" stroke-linejoin="round"/><path d="M305.00 155.00 L300 165 L295.00 155.00" fill="none" stroke="#2858b6" stroke-width="2.5"/><rect x="215" y="165" width="170" height="70" rx="5" fill="#eef3fc" stroke="#2858b6" stroke-width="2.5"/><text x="300.0" y="208.05" font-size="23" fill="#17263c" font-weight="600" text-anchor="middle">참조모형</text><text x="300" y="290" font-size="21" fill="#17263c" font-weight="500" text-anchor="middle">어떤 공통 기준?</text><text x="300" y="320" font-size="21" fill="#17263c" font-weight="500" text-anchor="middle">분류·재사용</text><path d="M300 90 L300 125 L495 125 L495 165" fill="none" stroke="#2858b6" stroke-width="2.5" stroke-linejoin="round"/><path d="M500.00 155.00 L495 165 L490.00 155.00" fill="none" stroke="#2858b6" stroke-width="2.5"/><rect x="410" y="165" width="170" height="70" rx="5" fill="#eef3fc" stroke="#2858b6" stroke-width="2.5"/><text x="495.0" y="208.05" font-size="23" fill="#17263c" font-weight="600" text-anchor="middle">성숙도 모델</text><text x="495" y="290" font-size="21" fill="#17263c" font-weight="500" text-anchor="middle">어느 수준?</text><text x="495" y="320" font-size="21" fill="#17263c" font-weight="500" text-anchor="middle">평가·개선</text><text x="300" y="375" font-size="23" fill="#17654a" font-weight="500" text-anchor="middle">모델별 목적·내용·활용을 구분</text></g></svg>
