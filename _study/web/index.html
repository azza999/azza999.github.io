<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>기술사 · 쌓이는 공부</title><link rel="stylesheet" href="style.css"><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23101624'/%3E%3Cpath d='M7 24V18H12V24M14 24V12H19V24M21 24V6H26V24' stroke='%2356e3b5' stroke-width='3'/%3E%3C/svg%3E"></head><body><main><header><span class="brand">STUDY / LOG</span><span>정보관리기술사</span></header><section class="intro"><p class="eyebrow">매일 쌓이는 나의 공부</p><h1>공부한 만큼, 여기 남는다.</h1></section><div id="error" role="alert"></div><section class="metrics" aria-label="학습 성과"><article class="metric primary"><span>누적 숙련도 점수</span><strong id="total">—</strong><small>등록한 모든 주제의 점수 합계</small></article><article class="metric"><span>오늘 변화</span><strong id="today">—</strong><small>한국시간 · 커밋 기준</small></article><article class="metric"><span>이번 주 변화</span><strong id="week">—</strong><small>월요일부터 오늘까지</small></article><article class="metric"><span>공부를 시작한 주제</span><strong id="count">—</strong><small>1점 이상인 주제</small></article></section><section class="panel"><div class="section-head"><h2>쌓아온 기록</h2><span>날짜별 누적 점수</span></div><div id="chart"></div></section><section class="columns"><div class="panel"><h2>숙련도 분포</h2><div id="levels"></div></div><div class="panel"><h2>최근 점수 변화</h2><div id="events"></div></div></section><section class="panel"><div class="section-head"><h2>나의 주제</h2><span id="topic-count"></span></div><div id="topics"></div></section><footer>점수는 스스로 평가합니다. 기록은 커밋 날짜를 기준으로 남습니다.</footer></main><dialog id="detail"><button id="close" aria-label="주제 닫기">닫기</button><p id="detail-meta" class="eyebrow"></p><h2 id="detail-title"></h2><article id="detail-body"></article></dialog><script src="app.js"></script></body></html>
